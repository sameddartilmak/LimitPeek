<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <!-- Same posture as the panel: local files only, no network, no inline script. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="color-scheme" content="dark light" />
    <title>Usage Notch</title>
    <link rel="stylesheet" href="../../renderer/styles/tokens.css" />
    <link rel="stylesheet" href="../../renderer/styles/panel.css" />
    <link rel="stylesheet" href="./prompt.css" />
  </head>
  <body>
    <main class="un" aria-labelledby="un-title">
      <div class="un__head">
        <span class="un__logo" aria-hidden="true"></span>
        <h1 class="un__title" id="un-title"></h1>
      </div>
      <p class="un__lead" id="un-lead"></p>
      <ul class="un__list" id="un-list"></ul>
      <p class="un__keep" id="un-keep-note"></p>
      <label class="un__check">
        <input type="checkbox" id="un-keep" />
        <span id="un-keep-label"></span>
      </label>
      <div class="un__actions">
        <button type="button" class="btn" id="un-cancel"></button>
        <button type="button" class="btn btn--danger" id="un-remove"></button>
      </div>
    </main>
    <script src="./prompt.js"></script>
  </body>
</html>
