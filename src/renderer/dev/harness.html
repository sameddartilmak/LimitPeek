<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <!-- Same CSP the app ships with, so the harness cannot pass something the
         real window would reject. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:," />
    <title>LimitPeek — geliştirici önizlemesi</title>
    <link rel="stylesheet" href="../styles/tokens.css" />
    <link rel="stylesheet" href="../styles/panel.css" />
    <link rel="stylesheet" href="../styles/row.css" />
    <link rel="stylesheet" href="../styles/layouts.css" />
    <link rel="stylesheet" href="./harness.css" />
  </head>
  <body class="hx">
    <aside id="controls" class="hx-controls" aria-label="Önizleme denetimleri">
      <h2 class="hx-title">Geliştirici önizlemesi</h2>
      <p class="hx-note">
        Gerçek panel, sahte bir köprüyle çalışıyor. Elektron gerekmez.
      </p>
    </aside>
    <main class="hx-stage" aria-label="Panel">
      <div id="stage" class="hx-canvas"></div>
    </main>
    <script type="module" src="../dist/renderer/dev/harness.js"></script>
  </body>
</html>
